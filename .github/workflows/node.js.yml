name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # The build-matrix leg treated as the release candidate. Vercel performs the
  # actual deploy, so this no longer gates an upload; it is still the version
  # whose build must be green before a commit is considered shippable, and it
  # must stay in step with .nvmrc — the build job asserts that.
  DEPLOY_NODE: '26.x'

# Supersede stale PR runs, but never cancel a main run that may already be
# deploying. Deployment itself is Vercel's git integration, not a job here:
# this workflow is the gate that says the commit is safe to ship.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Shared job for installing dependencies with caching
  install:
    name: Install Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json', '.nvmrc') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

  # Lint, format, and type check
  code-quality:
    name: Code Quality
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Restore node_modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json', '.nvmrc') }}

      - name: Type Check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Format Check
        run: npm run format:check

      - name: Verify generated share card
        run: npm run og:check

  # Run tests
  test:
    name: Test
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Restore node_modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json', '.nvmrc') }}

      - name: Run tests
        run: npm run test:coverage

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  # Build on multiple OS and Node versions
  build:
    name: Build (${{ matrix.os }}, Node ${{ matrix.node-version }})
    needs: install
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The floor declared in package.json engines, and the version .nvmrc
        # pins for development and the rest of CI.
        node-version: [22.x, 26.x]
        os: [ubuntu-latest, windows-latest, macos-latest]
        exclude:
          # Reduce matrix size for faster CI. Non-Linux runners only need to
          # prove the build is portable, so they run the deployed version.
          - os: windows-latest
            node-version: 22.x
          - os: macos-latest
            node-version: 22.x
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Everything except this job takes its Node from .nvmrc, but a matrix
      # needs literals. If the two drift, the deploy leg stops being built and
      # main fails only after CI reports success. Catch it here, on the PR.
      - name: Check deploy candidate matches .nvmrc
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          pinned="$(tr -d 'v[:space:]' < .nvmrc | cut -d. -f1)"
          wanted="${DEPLOY_NODE%%.*}"
          if [ "$pinned" != "$wanted" ]; then
            echo "::error file=.nvmrc::.nvmrc pins Node $pinned but DEPLOY_NODE is $DEPLOY_NODE. Update both, and the build matrix."
            exit 1
          fi
          echo "Deploy candidate Node $wanted matches .nvmrc."

      - name: Build
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_ENV: production
          NEXT_PUBLIC_GA_TRACKING_ID: ${{ vars.NEXT_PUBLIC_GA_TRACKING_ID }}

      - name: Verify static export
        shell: bash
        run: |
          if [ ! -d "out" ]; then
            echo "Error: 'out' directory not found. Static export may have failed."
            exit 1
          fi
          echo "Static export successful. Found $(find out -type f | wc -l) files."

      # Checks generated HTML/XML itself: leaked drafts, robots, duplicate ids,
      # fragment and route targets, canonical/share metadata, local images, and
      # sitemap/RSS integrity. None of these are visible to component tests.
      - name: Verify export
        run: npm run verify-export


  # Summary job to ensure all checks pass
  ci-success:
    name: CI Success
    needs: [code-quality, test, build]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check if all jobs succeeded
        run: |
          if [[ "${{ needs.code-quality.result }}" != "success" || 
                "${{ needs.test.result }}" != "success" || 
                "${{ needs.build.result }}" != "success" ]]; then
            echo "One or more jobs failed"
            exit 1
          fi
          echo "All CI checks passed!"
